function matches(t){return query&&(normalize(t.name).includes(query)||t.guests.some(g=>normalize(g.name).includes(query)))}
function render(){
 $('tables').innerHTML=TABLES.map(t=>{const p=positions[t.id];return `<button type="button" class="table ${group(t)} ${selected===t.id?'selected':''} ${matches(t)?'match':''}" style="--x:${p.x};--y:${p.y}" data-table="${t.id}" aria-label="${safe(t.name+'，'+locationOf(t.id))}" aria-pressed="${selected===t.id}"><span class="label">${safe(shortName(t))}</span></button>`}).join('');
 document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{clearQueryForTableSelection();selectTable(Number(b.dataset.table),false)});
}
function hideResults(){ $('results').hidden=true;$('search').setAttribute('aria-expanded','false') }
function clearQueryForTableSelection(){$('search').value='';query='';$('clear').hidden=true;hideResults();$('status').textContent='輸入至少兩個字即可查詢姓名或桌名。'}
function selectTable(id,locate){selected=id;hideResults();$('search').blur();$('selection').hidden=false;document.body.classList.add('has-selection');$('selectedName').textContent=TABLES[id].name;$('selectedLocation').textContent=locationOf(id);render();if(locate){requestAnimationFrame(()=>document.querySelector(`[data-table="${id}"]`).scrollIntoView({behavior:reduced?'instant':'smooth',block:'center'}))}}
function search(){const input=$('search').value.trim(),next=normalize(input),ready=Array.from(next).length>=2,active=ready?next:'';if(active!==query){selected=null;$('selection').hidden=true;document.body.classList.remove('has-selection')}query=active;$('clear').hidden=!input;render();if(!ready){hideResults();$('status').textContent=input?'請至少輸入兩個字再搜尋。':'輸入至少兩個字即可查詢姓名或桌名。';return}
 const found=TABLES.filter(matches);$('status').textContent=found.length?`找到 ${found.length} 桌已亮起，點選結果可定位。`:'沒有符合的姓名或桌名。';
 $('results').innerHTML=found.length?found.map(t=>{const names=t.guests.filter(g=>normalize(g.name).includes(query));const text=names.length?names.map(g=>g.name+(g.seats>1?`（占${g.seats}席）`:'')).join('、'):t.name;return `<button class="result" data-result="${t.id}"><span><strong>${safe(text)}</strong><small>${safe(t.name)} · ${safe(locationOf(t.id))}</small></span><span class="result-tag">查看桌位</span></button>`}).join(''):'<div class="empty">找不到符合的名單。<br>請試試姓名的其他部分，或向現場招待確認。</div>';
 $('results').hidden=false;$('search').setAttribute('aria-expanded','true');document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>selectTable(Number(b.dataset.result),true))
}
function clearSearch(){$('search').value='';search();$('search').focus()}
$('search').addEventListener('input',search);$('search').addEventListener('focus',()=>{if(query)search()});$('search').addEventListener('keydown',e=>{if(e.key==='Escape')hideResults();if(e.key==='Enter'){e.preventDefault();if(Array.from(normalize($('search').value.trim())).length<2)return;const found=TABLES.filter(matches);if(found.length===1)selectTable(found[0].id,true);else $('results').querySelector('button')?.focus()}});
$('clear').onclick=clearSearch;
$('dismissSelection').onclick=()=>{selected=null;$('selection').hidden=true;document.body.classList.remove('has-selection');render()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search-wrap'))hideResults()});
render();
</script>
</body></html>
